name: Deploy linjiang-dev

# 当前源仓库的 GitHub Pages 部署。
# 大型素材继续走同一仓库的 jsDelivr，并钉在本次提交，保证页面与素材同版。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep large media on jsDelivr, pinned to this exact source revision.
      # Pinning avoids stale @main branch mapping and keeps deployed assets consistent.
      - run: npm run build
        env:
          ASSET_CDN: '1'
          # Media must come from the exact source revision being deployed.
          ASSET_CDN_REF: gh/tangquanghuy/linjiang-dev@${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
