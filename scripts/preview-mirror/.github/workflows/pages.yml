name: Deploy HUD preview mirror

# Generated preview mirror for tangquanghuy/linjiang-dev.
# The media CDN is pinned to the mirror's own commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep large media on jsDelivr, but pin it to this exact mirror snapshot.
      # This includes uncommitted icons/audio/plate files and avoids stale @main
      # branch mapping after the mirror's force-push.
      - run: npm run build
        env:
          ASSET_CDN: '1'
          # Preview media must come from the exact mirror snapshot being tested.
          # Pinning the commit avoids jsDelivr's stale @main mapping after force-pushes.
          ASSET_CDN_REF: gh/${{ github.repository }}@${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
